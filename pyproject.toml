[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ozon-reviews-parser"
version = "0.3.0"
description = "CLI-утилита для сбора отзывов, вопросов и характеристик товаров Ozon в JSON"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["ozon", "reviews", "parser", "scraping", "cli"]

# Верхние границы закреплены осознанно: Patchright повторяет API Playwright, и
# мажорное обновление может сменить сигнатуру launch_persistent_context.
dependencies = [
    "patchright>=1.40,<2.0",
    "python-dateutil>=2.9,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0", "pip-audit>=2.7"]

[project.scripts]
ozon-reviews-parser = "ozon.cli:main"

[project.urls]
Repository = "https://github.com/Lueur3/ozon-reviews-parser"

[tool.setuptools.packages.find]
include = ["ozon*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
